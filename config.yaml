# Odin configuration. Environment variables (.env) override the llm section and paths;
# see README.md. Relative paths resolve from the repository root.

llm:
  provider: anthropic          # anthropic | openai_compat   (env LLM_PROVIDER)
  model: ""                    # env LLM_MODEL; anthropic defaults to claude-opus-5-5
  base_url: null               # env LLM_BASE_URL (required for Gemini / Groq / OpenRouter)
  temperature: 0.0             # sent wherever the provider accepts sampling parameters
  effort: high                 # anthropic output_config.effort; "" to omit (env LLM_EFFORT)
  fallbacks: true              # anthropic server-side refusal fallback (env LLM_FALLBACKS)
  json_mode: true              # openai_compat response_format=json_object (env LLM_JSON_MODE)
  max_output_tokens: 32000     # includes thinking tokens on Claude models
  request_timeout_s: 600

limits:
  max_llm_calls: 60            # real API calls per process (cache hits are free)
  max_tokens_budget: 1500000   # input + output tokens per process
  max_retries: 4               # per call, exponential backoff on API errors
  backoff_base_s: 2.0
  backoff_max_s: 60.0
  rate_limit_max_wait_s: 240   # honour "retry in N s" up to this; longer (e.g. daily caps) fails fast
  validation_retries: 2        # re-prompts with the validation error on bad JSON

loops:                         # for the agents after Thor
  loki_max_rounds: 3
  loki_max_clarifications_per_doc: 5
  max_message_hops: 6
  heimdall_max_events_per_drop: 100
  norns_max_iterations: 500
  tyr_max_rulings_per_run: 25

thor:
  chunk_max_chars: 9000        # longer documents are split by top-level section (env ODIN_CHUNK_MAX_CHARS);
                               # 9000 keeps each request under ~8k tokens (e.g. Groq on-demand TPM limits)
  min_split_chars: 1500
  std_doc_id: STD
  recall_check: true           # re-extract (once) clauses whose figures no extraction captures
  recall_max_reextracts_per_doc: 8

norns:                         # timeline agent (deterministic dates and money)
  contracts: [A1, B1]          # root contracts; each brings its family (SLA, amendments, STD, DPA)
  horizon_months: 12           # instances run to 12 months after the last clock checkpoint
  projection_months: 12        # worst case: "no action" projected this far past as_of
  due_soon_days: 7             # the "due now" window
  writeup_min_words: 150
  writeup_max_words: 250

loki:                          # adversarial review agent (reads Thor's output; code checks every finding)
  max_findings_per_doc: 8
  max_input_tokens: 6000       # per call, estimated; larger documents are split by top-level section
  chars_per_token: 4.0         # estimate for that split (Thor's logged calls: 4.3 chars per token)
  context_tokens: 600          # company/context.txt is trimmed to about this
  max_llm_calls: 5             # real API calls per run_loki.py process (cache hits are free)

state:                         # shared state + uploaded originals
  backend: sqlite              # sqlite | supabase   (env STATE_BACKEND)
  bucket: contracts            # private Supabase Storage bucket (env SUPABASE_BUCKET)
  signed_url_ttl_s: 3600       # signed URLs for the original files expire after 1 hour
  connect_timeout_s: 10
  retries: 3                   # per Supabase call, exponential backoff from retry_backoff_s
  retry_backoff_s: 1.0
  # SUPABASE_DB_URL, SUPABASE_URL and SUPABASE_SECRET_KEY come from .env only (secrets)

upload:
  max_upload_mb: 20            # env ODIN_MAX_UPLOAD_MB
  allowed_extensions: [.pdf, .txt]
  min_pair_similarity: 0.85    # a .pdf less similar than this to its .txt is flagged

paths:
  bundle_dir: "02_Ragnarok Odin The Contract War Room/Pack/odin_dev_pack/bundle"   # env ODIN_BUNDLE_DIR
  db_path: state/odin.db                                                         # env ODIN_DB_PATH (sqlite backend)
  files_dir: state/files                                                         # env ODIN_FILES_DIR (sqlite backend)
  migrations_dir: supabase/migrations
  outputs_dir: outputs
  llm_cache_dir: .cache/llm
  prompts_dir: prompts
